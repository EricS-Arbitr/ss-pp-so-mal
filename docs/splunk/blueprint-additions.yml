# =========================================================================
# blueprint-additions.yml — distributed Splunk + Enterprise Security
# =========================================================================
# Draft for the platform blueprint. Design and reasoning live in
# docs/splunk/pp-splunk-distributed-build-sheet.md — read §3 (why split) and
# §11 (open decisions) before applying, because decision 1 changes the size
# of pp-splunk.
#
# ONE MODIFICATION + THREE ADDITIONS.
#
# This SPLITS a box that currently does three jobs. pp-splunk today runs
# Splunk Enterprise as indexer AND search head AND Enterprise Security --
# arbitr_pp_playbook.yaml applies both `splunk` and `splunk-es` to
# `hosts: splunk`. After this it is a search head only and receives no data.
#
# Schema copied from docs/security-onion/blueprint-additions.yml, which is
# the version that was actually applied as ARBITR_PP_1455 -- note the
# network interface name is lowercase `pp-security`.
# =========================================================================

# -------------------------------------------------------------------------
# 1. MODIFY AN EXISTING VM — pp-splunk becomes the dedicated ES search head
# -------------------------------------------------------------------------
# Address unchanged at 172.16.9.20. It stays the analyst-facing address and
# `splunk_server_ip` currently points at it; what changes is that it stops
# being the thing forwarders send to. See build sheet §5 -- that variable
# has exactly one functional consumer here
# (roles/splunk-forwarder/templates/outputs.conf.j2), which makes this a much
# smaller migration than the equivalent in airfield.
#
# ** SIZING: DECIDED 2026-08-17 (Eric) — resize pp-splunk. **
# Current allocation is 16 vCPU / 32 GB (docs/security-onion/blueprint-
# additions.yml records so-manager as "sized to match pp-splunk" at those
# values). It goes to 32 / 64 GB below.
#
# Splunk search concurrency is base_max_searches (6) + 1 per core, with
# max_searches_perc reserving 50% for scheduled work -- and ES ships 100+
# scheduled correlation searches:
#
#     cores | total | scheduled | ad-hoc | analysts @ ~1.5 concurrent
#        16 |    22 |        11 |     11 | ~7
#        24 |    30 |        15 |     15 | ~10
#        32 |    38 |        19 |     19 | ~12-13
#
# 32 vCPU / 64 GB is sized for the STATED TARGET of >10 concurrent analysts
# and gives ~19 ad-hoc search slots against ES's scheduled load.
#
# WORTH KNOWING: PowerPlant's [hunt] group currently contains win-hunt-1 and
# nothing else, so the analyst count this is sized for does not exist yet.
# The resize is still the right call -- undersizing a dedicated ES search
# head is expensive to discover later, and splitting the roles is worth
# doing at any analyst count because ES's scheduled searches contend with
# indexing on a combined box. But if the analyst count is NOT going to grow,
# 16 / 32768 would serve, and the honest reason to spend the extra 16 vCPU
# is the future headroom rather than present need.
#
# Reaching >10 analysts also needs more than one hunt workstation --
# .24-.29 in PP-Security are free. See "NOT SPECIFIED HERE" below.
- type: "range.resource.primitive.VmInstance::1.0.0"
  name: "pp-splunk"
  properties:
    image: "global/RDP_Ubuntu_Desktop_22.04.5:1.1.0"
    cpuCount: 32                      # WAS 16 — approved 2026-08-17
    memory: "65536"                   # WAS 32768 — approved 2026-08-17
    networkInterfaces:
    - name: "pp-security"
      ipAddress: "172.16.9.20"        # unchanged
      prefix: 24
    managementInterface:
      ipAddress: "10.255.240.175"     # unchanged
      position: "FIRST"

# -------------------------------------------------------------------------
# 2-3. NEW — indexer cluster peers
# -------------------------------------------------------------------------
# Two peers with replication factor 2 / search factor 2. Replication is the
# smaller reason; the larger one is that CIM data model acceleration runs on
# the INDEXING tier and is typically the dominant load in an ES deployment --
# more than ingest. On the current single instance it competes directly with
# the searches it exists to serve.
#
# A third peer becomes worthwhile past a few hundred GB/day, which this range
# is nowhere near.
- type: "range.resource.primitive.VmInstance::1.0.0"
  name: "pp-splunk-idx01"
  properties:
    image: "global/RDP_Ubuntu_Desktop_22.04.5:1.1.0"
    cpuCount: 16
    memory: "32768"
    networkInterfaces:
    - name: "pp-security"
      ipAddress: "172.16.9.21"
      prefix: 24
    managementInterface:
      ipAddress: "10.255.240.209"
      position: "FIRST"

- type: "range.resource.primitive.VmInstance::1.0.0"
  name: "pp-splunk-idx02"
  properties:
    image: "global/RDP_Ubuntu_Desktop_22.04.5:1.1.0"
    cpuCount: 16
    memory: "32768"
    networkInterfaces:
    - name: "pp-security"
      ipAddress: "172.16.9.22"
      prefix: 24
    managementInterface:
      ipAddress: "10.255.240.210"
      position: "FIRST"

# -------------------------------------------------------------------------
# 4. NEW — management tier
# -------------------------------------------------------------------------
# Cluster manager + license manager + deployment server + monitoring
# console. All four are light singletons; splitting them costs three more
# VMs that must come up unattended and buys nothing at this scale.
#
# The cluster manager is REQUIRED, not optional: indexes must be pushed to
# the peers through its manager-apps mechanism rather than edited on peers
# directly, and it is what makes indexer discovery available to forwarders
# so a third peer later needs no forwarder change.
- type: "range.resource.primitive.VmInstance::1.0.0"
  name: "pp-splunk-cm"
  properties:
    image: "global/RDP_Ubuntu_Desktop_22.04.5:1.1.0"
    cpuCount: 8
    memory: "16384"
    networkInterfaces:
    - name: "pp-security"
      ipAddress: "172.16.9.23"
      prefix: 24
    managementInterface:
      ipAddress: "10.255.240.211"
      position: "FIRST"

# -------------------------------------------------------------------------
# 5-9. NEW — hunt workstations win-hunt-2 .. win-hunt-6
# -------------------------------------------------------------------------
# Brings the analyst estate to six, which is what makes the >10-analyst
# sizing of pp-splunk above something other than theoretical. [hunt]
# previously contained win-hunt-1 alone.
#
# Addressed .12-.16 so the hunt boxes stay contiguous with win-hunt-1 at
# .11, rather than starting a second block at .24.
#
# ** IMAGE MUST BE 1.0.6, NOT 1.1.0. **
# RDP_Windows_10:1.1.0 ships with DHCP ENABLED on the adapter, and the
# common role's DSC xIPAddress then fails with a cryptic "Not found" from
# CIM -- the host never gets its static address. This is recorded against
# win-hunt-1 itself (PROJECT_LOG entry 1, UPSTREAM_FIXES 2026-05-xx), which
# was reverted to 1.0.6 for exactly this reason and filed upstream as a
# `common` role enhancement.
#
# If `common` has since gained a "disable DHCP before applying static"
# step, 1.1.0 becomes safe and this note can go. Verify before changing it
# -- roles/common is not in this repo (it comes from the controller's base
# roles), so it could not be checked from here.
#
# Sizing: matches win-hunt-1. Confirm against its CURRENT blueprint entry
# and align if it differs -- these should not be the odd ones out.
- type: "range.resource.primitive.VmInstance::1.0.0"
  name: "win-hunt-2"
  properties:
    image: "RDP_Windows_10:1.0.6"
    cpuCount: 4
    memory: "8192"
    networkInterfaces:
    - name: "pp-security"
      ipAddress: "172.16.9.12"
      prefix: 24
    managementInterface:
      ipAddress: "10.255.240.212"
      position: "FIRST"

