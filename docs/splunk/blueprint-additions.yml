# =========================================================================
# ADDRESSING NOTES
# =========================================================================
# PP-Security 172.16.9.0/24 currently in use:
#   .1  pp-internal-router   .11 win-hunt-1        .20 pp-splunk
#   .30 so-manager           .35 so-search         .40 so-sensor-corp
#   .41 so-sensor-ot         .42 so-sensor-edge
# .21-.29 are free and contiguous; .21/.22/.23 taken above.
#
# Management: current high-water is 10.255.240.208, so the three new hosts
# continue at .209-.211.
#
# ** VERIFY BOTH RANGES AGAINST THE CURRENT BLUEPRINT BEFORE APPLYING. **
# host_vars is not authoritative for what the platform has already handed
# out. The Security Onion draft for this range collided on 10.255.240.136
# for exactly this reason -- the collision check was clean only because it
# compared against a stale local copy of an older blueprint. Diff the
# CURRENT blueprint, never a local copy.
#
# =========================================================================
# PLATFORM COST OF THIS CHANGE
# =========================================================================
#   new VMs        3   (16 + 16 + 8 = 40 vCPU, 80 GB)
#   pp-splunk      +16 vCPU, +32 GB  (approved 2026-08-17)
#   -------------------------------------------------------------------
#   total          56 vCPU / 112 GB additional
#
# Confirm the range has that headroom before applying -- this is a
# substantial ask on top of what the Security Onion grid already added
# (1 manager + 1 search + 3 sensors = 56 vCPU / 112 GB in its own right).
#
# =========================================================================
# NOT SPECIFIED HERE — AND IT MATTERS
# =========================================================================
# 1. DISK. The schema used by this range's applied blueprint
#    (ARBITR_PP_1455) carries no disk property, so the platform assigns a
#    default. Indexer storage is retention-driven and the default is
#    unlikely to be right for two cluster peers holding replicated copies of
#    everything. Decide a retention window, then confirm how disk is
#    allocated on this platform -- it may need a separate resource or a
#    different image. Build sheet decision 2.
#
# 2. ANALYST WORKSTATIONS. If the >10-analyst target is real, [hunt] needs
#    more than win-hunt-1. .24-.29 in PP-Security are free. Deliberately NOT
#    added here -- that is a scenario-design decision, not a SIEM one, and
#    it changes the user/persona work in the range as well as the VM count.
#
# 3. RETIRING THE OLD DATA. pp-splunk currently holds every indexed bucket.
#    After the split it stores none, and those buckets do not move by
#    themselves. On a range rebuilt between exercises this is a non-issue;
#    on a range whose data matters it needs a separate plan. Build sheet §6.
#
# =========================================================================
# WHAT MUST BE TRUE BEFORE THIS IS WORTH DEPLOYING
# =========================================================================
# ES is already installed on pp-splunk today, and its correlation searches
# fire off ACCELERATED DATA MODELS, not raw events. If the range's data is
# not CIM-compliant, ES generates few notables regardless of how the
# hardware is arranged -- and splitting the tiers will not change that.
#
# Check on the CURRENT single instance before building anything:
#
#   | tstats count from datamodel=Authentication where nodename=Authentication
#       by sourcetype
#
# If that returns little or nothing, the models are not being populated and
# the CIM/TA work (build sheet §9) is the actual bottleneck, not the
# topology. Note also that `netfw` is documented in group_vars as "reserved
# for pfsense/vyatta syslog when wired up", so Network_Traffic may have no
# feed at all.
