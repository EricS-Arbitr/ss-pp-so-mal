---
# =========================================================================
# site.yml — full PowerPlant deploy: range baseline, then Security Onion
# =========================================================================
# Phase 0 is the existing range playbook. Phases 10-60 are the Security
# Onion stack, ported from so-ansible where they were validated end to end
# on a fresh range (2026-07-29/30).
#
# WHY arbitr_pp_playbook.yaml IS PHASE ZERO, AND WHY 00-setup.yml IS ABSENT
# ------------------------------------------------------------------------
# so-ansible's series opens with 00-setup.yml, which runs `init` + `common`
# to baseline Windows and Linux hosts. arbitr_pp_playbook.yaml ALREADY does
# that for this whole range, including the five SO nodes (they are in
# [ubuntu22] and [linux]). Importing both would run two NetworkManager /
# netplan passes over the same hosts, and `common` reboots when netplan
# changes — so you would risk two reboot cycles per host for no gain.
#
# ORDERING IS LOAD-BEARING
# ------------------------
#   10  RUNS FIRST, ahead of the range baseline, for two reasons.
#       (a) FAIL FAST. The mirror is a hard prerequisite for phases 30/40/50.
#           Discovering it is broken after a multi-hour baseline wastes the
#           whole run; discovering it in minutes costs nothing.
#       (b) OVERLAP. It kicks the 7.2 GB container-image build off in the
#           BACKGROUND and returns, so the baseline and phases 20/30 run
#           while it downloads. 40-manager blocks on the artifacts.
#       Safe to hoist: the controller is in [ansible_controller] +
#       [infrastructure] only -- never [linux] -- and
#       arbitr_pp_playbook.yaml never targets it, so nothing the baseline
#       does is a precondition for the mirror.
#       Still must precede 30: so_base fetches the pinned SO source from it.
#   20  the GRE tunnel + tc rules must exist before a sensor can receive
#   30  so_base stages the SO source on every node
#   40  the MANAGER must fully complete before 50 — search and sensor join
#       it, and grid-join fails against a manager that is not yet green
#   50  search + sensor
#   60  verification
#
# ITERATING
# ---------
# Re-running phase 0 across ~30 hosts to test an SO change is slow. During
# development run a single phase directly:
#     ansible-playbook playbooks/40-manager.yml
# deploy.sh runs this file end to end.
# =========================================================================

# Mirror first — see ORDERING above. Starts the long download, then returns.
- import_playbook: playbooks/10-mirror.yml

- import_playbook: arbitr_pp_playbook.yaml

# Windows clocks read the UTC RTC as local time, so every Windows host runs
# hours fast. Harmless while everything is consistently wrong, fatal once a
# Windows clock is compared to a Linux one -- SOC logins and endpoint event
# timestamps both. Runs early and DC-first so Kerberos never sees skew.
- import_playbook: playbooks/05-time.yml

- import_playbook: playbooks/20-vyos.yml
- import_playbook: playbooks/30-prereqs.yml
- import_playbook: playbooks/40-manager.yml
- import_playbook: playbooks/50-nodes.yml
- import_playbook: playbooks/60-verify.yml

# Analyst-side enablement: the hunt workstations must be able to LOG IN to
# SOC, which the grid phases above do not cover. Separate phase because it
# targets Windows analyst boxes, not the SO grid.
- import_playbook: playbooks/70-analyst.yml

# Endpoint telemetry: Sysmon everywhere, then Elastic Agent into SO's Fleet.
- import_playbook: playbooks/75-endpoint.yml

# Host-scoped log sources (nginx, squid) into SO via dedicated Fleet
# policies. AFTER 75-endpoint: it reassigns agents that phase enrols.
- import_playbook: playbooks/80-fleet-integrations.yml
