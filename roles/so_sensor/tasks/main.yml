---
# LIFETIME INVARIANT — must precede the `meta: end_host` probe below, or an
# already-installed sensor can never reach it (the recurring trap in this repo).
- name: Preflight — confirm this role is running with escalated privilege
  ansible.builtin.command: id -u
  register: _role_euid
  changed_when: false

# so_sensor carries no task-level `become`: it relies entirely on the calling
# play supplying `become: true`. That contract is invisible until a task
# fails on a permission error somewhere in the middle, which is an expensive
# way to learn it -- on this project every such discovery costs a
# build/upload/deploy round trip through a web console.
#
# Two `become` mistakes on 2026-08-04/05 came from exactly this ambiguity:
# a play-level become that broke an unprivileged chmod, then removing it
# entirely and breaking a privileged remote read. State the requirement and
# fail on it immediately.
- name: Fail immediately if so_sensor was invoked without become
  ansible.builtin.fail:
    msg: >-
      so_sensor requires privilege escalation but is running as uid
      {{ _role_euid.stdout | trim }}. Add `become: true` to the play that
      invokes it. Every task in this role assumes root; without it you get a
      permission error partway through, in a task that looks unrelated.
  when: (_role_euid.stdout | trim) != '0'

- name: Preflight — so_gre_remote_underlay must be set for this sensor
  ansible.builtin.fail:
    msg: |
      {{ inventory_hostname }} has no so_gre_remote_underlay.

      It is the mirroring router's vyos_gre_source_ip -- the address the
      encapsulated packets actually arrive FROM. It drives both the netplan
      tunnel's `remote:` and the SO firewall's proto-47 ACCEPT.

      There is deliberately no default. so-ansible's dev range worked only
      because that address happened to equal the sensor's so_prod_gateway;
      defaulting to the gateway again would silently rebuild that trap.

      Set it in host_vars/{{ inventory_hostname }}.yml to match the router's
      vyos_gre_source_ip exactly.
  when: so_gre_remote_underlay is not defined or (so_gre_remote_underlay | trim) == ''

# =========================================================================
# so_sensor — GRE tunnel + SENSOR install joining manager
# =========================================================================

# NOTE: this block runs BEFORE the idempotency probe below on purpose.
# The probe ends the host via `meta: end_host` once /opt/so/state/installed
# exists, so ANY task placed after it can never reach an already-installed
# node. Discovered 2026-07-29 when this exact fix silently no-op'd on
# so-sensor-1. Same family as the self-blessing setup marker: a guard that
# blocks its own remediation.
# --- Permit GRE through SO's host firewall ------------------------------
# SO's firewall DROPs the GRE mirror before it ever reaches the kernel's
# tunnel decap. Verified 2026-07-29: every rule SO can generate carries a
# mandatory `--dport` (firewall/iptables.jinja), and GRE is portless — so
# there is NO hostgroup/portgroup/pillar combination that expresses proto
# 47. SO hardcodes `-A INPUT -p icmp -j ACCEPT` for the one portless
# protocol it supports, which confirms there's no general mechanism.
# Unmatched traffic falls to the LOGGING chain, which is log-then-DROP.
#
# `iptables_restore` in firewall/init.sls is a bare cmd.run with no
# `onchanges`, so it re-runs on EVERY highstate (~15 min) — a manually
# added rule cannot survive. The fix has to live in salt.
#
# Salt file_roots put /opt/so/saltstack/local/salt AHEAD of default/salt,
# so a file at local/salt/firewall/iptables.jinja overrides the stock
# template. Rather than vendoring a 5KB fork into this repo (which would
# silently go stale on SO upgrades), we DERIVE the override from whatever
# SO currently ships and inject one guarded block. The result is correct
# by construction on any SO version whose template still contains the
# anchor line.
#
# Runs on the MANAGER: the sensor has no /opt/so/saltstack at all — rules
# are rendered master-side and pushed.
- name: GRE firewall — read SO's stock iptables template on the manager
  ansible.builtin.slurp:
    src: /opt/so/saltstack/default/salt/firewall/iptables.jinja
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: so_stock_ipt

- name: GRE firewall — fail loudly if the FORWARD anchor is gone (SO upgraded)
  ansible.builtin.fail:
    msg: |
      Cannot place the tun0 FORWARD drop: anchor '{{ so_tun_forward_anchor }}'
      not found in SO's iptables.jinja.

      Without it the sensor forwards mirrored traffic, SO's FORWARD reject
      fires, and the sensor emits ICMP unreachables to hosts across the range
      from its own prod IP -- telling workstations that Splunk and the DCs are
      unreachable. A passive sensor must not generate traffic.

      Re-derive the anchor from the current template and update
      so_tun_forward_anchor.
  when: so_tun_forward_anchor not in (so_stock_ipt.content | b64decode)

- name: GRE firewall — fail loudly if the anchor line is gone (SO upgraded)
  ansible.builtin.fail:
    msg: |
      Cannot patch SO's firewall template: anchor '{{ so_gre_anchor }}' not
      found in /opt/so/saltstack/default/salt/firewall/iptables.jinja.
      SO's firewall template changed shape. Re-derive the override by hand
      and update so_gre_anchor. Until then the GRE mirror will be dropped
      and the sensor will capture nothing.
  when: so_gre_anchor not in (so_stock_ipt.content | b64decode)

- name: GRE firewall — write derived override into local/salt (takes precedence)
  ansible.builtin.copy:
    # Single-line form on purpose — a `|` block scalar would re-indent and
    # newline-pad the rendered file.
    # Two injections, both ahead of their anchors: GRE accepts into INPUT, and
    # a DROP for mirrored traffic into FORWARD. Chained replaces on one
    # expression so the file is written once.
    content: "{{ (so_stock_ipt.content | b64decode) | replace(so_gre_anchor, so_gre_rule_block + so_gre_anchor) | replace(so_tun_forward_anchor, so_tun_forward_rule + so_tun_forward_anchor) }}"
    dest: /opt/so/saltstack/local/salt/firewall/iptables.jinja
    owner: socore
    group: socore
    mode: '0640'
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: so_gre_override

# On a FRESH sensor this runs before grid-join, when salt-call cannot
# reach the master yet. Skip the apply in that case — the manager-side
# override is already written, so the sensor's first highstate renders it
# correctly on its own. Only already-joined nodes need the nudge.
- name: GRE firewall — is this node already a grid member?
  ansible.builtin.stat:
    path: /etc/salt/pki/minion/minion_master.pub
  register: so_grid_member

- name: GRE firewall — apply firewall state on this sensor
  ansible.builtin.command: "sudo salt-call state.apply firewall queue=True"
  become: true
  when: so_grid_member.stat.exists
  register: gre_fw_apply
  changed_when: gre_fw_apply.rc == 0
  # Same highstate-scheduler collision as the grid-join firewall apply.
  until: gre_fw_apply.rc == 0
  retries: 40
  delay: 30

# firewall/init.sls guards its restore with `onlyif: iptables-restore
# --test <file>`. A malformed rendered file therefore SKIPS the restore
# silently while salt still reports success — the running ruleset just
# goes stale. Check it explicitly so a syntax error is loud and names
# itself, instead of surfacing as a mysterious "rule not present".
- name: GRE firewall — syntax-check the rendered ruleset
  ansible.builtin.command: "iptables-restore --test /etc/iptables/rules.v4"
  become: true
  changed_when: false
  register: ipt_syntax
  failed_when: ipt_syntax.rc != 0
  when: so_grid_member.stat.exists

- name: GRE firewall — verify the tun0 FORWARD drop is in the running ruleset
  ansible.builtin.shell: |
    iptables -S FORWARD | grep -E -- "-A FORWARD -i {{ so_monitor_interface }} -j DROP"
  become: true
  changed_when: false
  register: tun_drop_check
  failed_when: tun_drop_check.rc != 0
  when: so_grid_member.stat.exists

- name: GRE firewall — verify proto 47 is now accepted in INPUT
  ansible.builtin.shell: |
    iptables -S INPUT | grep -E '\-p (gre|47) '
  become: true
  changed_when: false
  register: gre_rule_check
  failed_when: gre_rule_check.rc != 0
  when: so_grid_member.stat.exists

- name: GRE firewall — report
  ansible.builtin.debug:
    msg: >-
      {{ 'GRE accepted in INPUT: ' ~ gre_rule_check.stdout_lines
         if so_grid_member.stat.exists
         else 'Fresh node — manager-side override written; first highstate will apply it.' }}

# --- GRE tunnel — LIFETIME INVARIANT, must precede the end_host probe ----
# Moved above the idempotency probe 2026-08-04. It was below it, so an
# already-installed sensor could never receive a tunnel correction -- the
# exact "guard blocks its own remediation" trap this repo keeps rebuilding
# (PORTING_GUIDE 9.4). The tunnel definition must be re-asserted on every
# run, not only on first install.

- name: Deploy netplan drop-in for GRE tunnel {{ so_monitor_interface }}
  ansible.builtin.template:
    src: 60-so-mirror-tun.yaml.j2
    dest: "{{ so_sensor_netplan_tun }}"
    mode: '0600'
    owner: root
    group: root
  register: netplan_tun

# netplan will not convert an existing L3 `gre` device into a `gretap` one --
# the link kind is fixed at creation. Left in place, the old tunnel keeps
# working, keeps feeding Suricata, and keeps Zeek parsing nothing, which is
# indistinguishable from success on every check we had.
- name: Remove a stale L3 gre tunnel so netplan can recreate it as gretap
  ansible.builtin.shell: |
    set -o pipefail
    kind=$(ip -d link show {{ so_monitor_interface }} 2>/dev/null | awk '/gre|gretap/ {for(i=1;i<=NF;i++) if($i=="gre"||$i=="gretap"){print $i; exit}}')
    if [ "$kind" = "gre" ]; then
      ip link del {{ so_monitor_interface }}
      echo "deleted stale L3 gre {{ so_monitor_interface }}"
    else
      echo "kind=${kind:-absent}"
    fi
  args:
    executable: /bin/bash
  register: stale_tun
  changed_when: "'deleted stale' in stale_tun.stdout"

- name: netplan apply (brings tun0 up)
  ansible.builtin.command: netplan apply
  when: netplan_tun.changed or (stale_tun is changed)



- name: Wait for {{ so_monitor_interface }} to appear
  ansible.builtin.wait_for:
    path: "/sys/class/net/{{ so_monitor_interface }}"
    timeout: 15

- name: Force promiscuous on {{ so_monitor_interface }} (needed for sniffing)
  ansible.builtin.command: "ip link set dev {{ so_monitor_interface }} promisc on"
  changed_when: false

# `'UP' not in stdout` passes on the LOWER_UP flag, on UNKNOWN state text, and
# on any future field containing those two letters -- it is a substring test
# against free-form output (PORTING_GUIDE 9.15b). GRE tunnels report state
# UNKNOWN, never UP, so the old check was passing purely on the flag list.
# Assert on the flag list explicitly, which is what actually matters: the
# interface is administratively up and the carrier is present.
- name: Verify the tunnel interface is administratively up with carrier
  ansible.builtin.command: "ip -brief link show {{ so_monitor_interface }}"
  register: tun_state
  changed_when: false
  # `[<,]UP[,>]` matches UP as a whole token in the flag list and does NOT
  # match LOWER_UP, where the preceding character is an underscore.
  failed_when: >-
    tun_state.stdout is not search('[<,]UP[,>]')
    or 'LOWER_UP' not in tun_state.stdout

# "UP" is not proof. PowerPlant 2026-08-04: tun0 was UP, PROMISC and carried a
# valid /30 while RX sat at 0 packets, because the tunnel's remote pointed at
# the wrong router and the kernel declined to decapsulate. Assert the endpoint
# the tunnel actually bound, not merely that an interface exists.
- name: Verify the tunnel bound the CORRECT remote endpoint
  ansible.builtin.command: "ip -d link show {{ so_monitor_interface }}"
  register: tun_remote
  changed_when: false
  failed_when: "'remote ' ~ so_gre_remote_underlay not in tun_remote.stdout"

# THE INTERFACE MUST STOP MOVING BEFORE ZEEK ATTACHES TO IT.
#
# netplan's renderer here is NetworkManager (99-netcfg-vmware.yaml), so
# `netplan apply` regenerates NM profiles and hands off -- NM then activates
# the tunnel on its own schedule. Restarting Zeek immediately after the apply
# is a race: Zeek binds an AF_PACKET socket to a tun0 that NM is about to
# replace, and the workers are left reading a device that no longer exists.
#
# Observed 2026-08-14 on soc-sensor-edge: netplan written 18:24, Zeek
# restarted straight after, conn.log stopped at 18:25:07 while the workers
# stayed RUNNING in run_loop and capture_loss kept being written. Every
# liveness signal looked healthy. A manual restart once the interface had
# settled logged continuously at ~450 conn records/min.
#
# Gate on the ifindex being unchanged across a window rather than sleeping a
# fixed amount -- a fixed sleep is the same bet with a different number.
- name: Wait until {{ so_monitor_interface }} stops being recreated
  ansible.builtin.shell: |
    set -o pipefail
    a=$(cat /sys/class/net/{{ so_monitor_interface }}/ifindex 2>/dev/null || echo none)
    sleep 20
    b=$(cat /sys/class/net/{{ so_monitor_interface }}/ifindex 2>/dev/null || echo none)
    if [ "$a" = "$b" ] && [ "$a" != "none" ]; then echo "STABLE idx=$b"; else echo "MOVING $a -> $b"; fi
  args:
    executable: /bin/bash
  register: tun_settle
  changed_when: false
  until: "'STABLE' in tun_settle.stdout"
  retries: 6
  delay: 5

# THE TUNNEL CHANGED UNDER A RUNNING ZEEK.
#
# Zeek's workers hold an AF_PACKET socket bound to tun0 at startup. Deleting
# and recreating the interface -- which switching gre -> gretap requires,
# since link kind is fixed at creation -- leaves them attached to a device
# that no longer exists. They keep running, keep reporting healthy, and keep
# producing nothing, which is indistinguishable from the bug we just fixed.
#
# Only relevant on a range where SO is ALREADY installed. On a fresh deploy
# the tunnel exists before so-setup runs, so Zeek attaches to gretap first
# time and this is a no-op.
- name: Is SO already installed here?
  ansible.builtin.stat:
    path: "{{ so_sensor_installed_marker }}"
  register: so_installed_for_restart

- name: Restart Zeek so it re-attaches to the recreated tunnel
  ansible.builtin.command: so-zeek-restart
  when:
    - so_installed_for_restart.stat.exists
    - (netplan_tun is changed) or (stale_tun is changed)
  register: zeek_restart
  changed_when: zeek_restart.rc == 0
  # so-zeek-restart is absent before so-setup completes; tolerate that by
  # name rather than ignoring every failure.
  failed_when:
    - zeek_restart.rc != 0
    - "'command not found' not in (zeek_restart.stderr | default(''))"

- name: Report tunnel state
  ansible.builtin.debug:
    msg: "{{ so_monitor_interface }}: {{ tun_state.stdout }}"

# --- LIFETIME INVARIANT: this node's entry in the manager's firewall -------
# Moved above the `meta: end_host` probe 2026-08-05 (structural pass 3/5).
#
# This is MANAGER-SIDE state, not node-side. The node being installed says
# nothing about whether the manager still lists it: a rebuilt manager, a
# restored pillar, or a hand-edited hostgroup all leave an installed node
# permanently unable to reach salt on 4505/4506, and the old ordering meant
# a re-run could never repair it -- the play ended at the probe first.
#
# Cheap on re-runs: `so-firewall includehost` reports "already exists" (rc=3)
# and is not `changed`, so the expensive apply below is skipped entirely.
- name: Grid join — on manager, add this node's IP to sensor firewall hostgroup
  ansible.builtin.command: "sudo /usr/sbin/so-firewall includehost sensor {{ so_prod_ip }}"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: fw_add
  changed_when: "'Successfully added' in fw_add.stdout"
  # so-firewall returns rc=3 with "WARNING - IP already exists" on repeated adds. Idempotent, not a failure.
  failed_when:
    - fw_add.rc != 0
    - "'already exists' not in fw_add.stderr"

- name: Grid join — on manager, apply firewall state (opens 4505/4506 for this node)
  ansible.builtin.command: sudo salt-call state.apply firewall queue=True
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: fw_apply
  changed_when: fw_apply.rc == 0
  # Highstate scheduler retry logic (see so_search for full rationale).
  until: fw_apply.rc == 0
  retries: 40
  delay: 30
  # Gate on the EXIT CODE, not on `changed`. rc=0 means the entry was added;
  # rc=3 is "already exists". Keying off `changed` would couple this to
  # `changed_when`'s stdout string-match, so a reworded so-firewall message
  # would silently skip the apply on a FRESH node and leave 4505/4506 shut --
  # the failure would surface much later as a grid join that never completes.
  when: fw_add.rc == 0

- name: Idempotency probe
  ansible.builtin.stat:
    path: "{{ so_sensor_installed_marker }}"
  register: so_installed

- name: End play early if SO is already installed
  ansible.builtin.meta: end_host
  when: so_installed.stat.exists

- name: Precondition — SO source must be at {{ so_source_dest }}
  ansible.builtin.stat:
    path: "{{ so_source_dest }}/setup/so-setup"
  register: so_setup_present

- name: Fail loudly if so_base didn't stage the source
  ansible.builtin.fail:
    msg: "SO source missing at {{ so_source_dest }}/setup/so-setup. Re-run 30-prereqs."
  when: not so_setup_present.stat.exists

# --- Compute prod NIC + netmask -----------------------------------------

- name: Gather network facts
  ansible.builtin.setup:
    gather_subset:
      - network

- name: Compute so_prod_nic
  ansible.builtin.set_fact:
    so_prod_nic: >-
      {{ (ansible_facts['interfaces']
          | map('regex_replace', '-', '_')
          | map('extract', ansible_facts)
          | selectattr('ipv4', 'defined')
          | selectattr('ipv4.address', 'equalto', so_prod_ip)
          | map(attribute='device')
          | list
          | first) }}

- name: Compute so_prod_netmask
  ansible.builtin.set_fact:
    so_prod_netmask: >-
      {{ {16:'255.255.0.0', 20:'255.255.240.0', 22:'255.255.252.0',
          23:'255.255.254.0', 24:'255.255.255.0', 25:'255.255.255.128',
          26:'255.255.255.192', 27:'255.255.255.224', 28:'255.255.255.240',
          29:'255.255.255.248', 30:'255.255.255.252',
          31:'255.255.255.254', 32:'255.255.255.255'
      }[so_prod_prefix | int] }}

# --- Render + drop answer file ------------------------------------------

- name: Render sensor answer file to /root/so-answers.env
  ansible.builtin.template:
    src: sensor.env.j2
    dest: /root/so-answers.env
    mode: '0600'
    owner: root
    group: root

# --- Force so-setup's "cloud" interface path -----------------------------
# BNICS=tun0 is IGNORED on a normal install. Verified 2026-07-28 against
# our pinned SO source:
#
#   so-functions generate_interface_vars():
#     if [[ $is_cloud ]]; then INTERFACE=${BNICS[0]}; else INTERFACE='bond0'; fi
#
# BNICS is not "the interface to monitor" — it is "the NICs to enslave
# into bond0", and INTERFACE is hardcoded to bond0 off-cloud. so-setup
# duly created a bond0 (NO-CARRIER, DOWN, mtu 9000) and pointed Suricata
# and Zeek at it, which is why the sensor captured nothing.
#
# A GRE tunnel cannot be enslaved into a bond, so the bond path can never
# work for our GRE-mirror design. The cloud path is the one that fits:
#
#   so-functions configure_network_sensor(): nmcli type ethernet (not bond)
#   so-common    add_interface_bond0():      ALL slave logic is wrapped in
#                                            `if ! [[ $is_cloud ]]` — so it
#                                            only sets promisc on tun0
#   so-functions generate_interface_vars():  INTERFACE=${BNICS[0]} = tun0
#
# detect_cloud() keys off a bare file test (`[ -f /etc/SOCLOUD ]`), so we
# opt in without patching any SO script — CLAUDE.md §8 prefers this over
# editing SO's own files. Sensor-only: manager/search have no monitor
# interface and should keep stock behavior.
- name: Force so-setup cloud interface path (makes BNICS=tun0 actually apply)
  ansible.builtin.file:
    path: /etc/SOCLOUD
    state: touch
    mode: '0644'
    owner: root
    group: root
  when: so_sensor_force_cloud_mode | bool

# --- Run so-setup + wait ------------------------------------------------

# --- so-setup skip decision (POSITIVE proof, not just an exit code) ------
# See so_search/tasks/main.yml for the full rationale. Short version:
# `creates: <marker>` + "rc == 0" is self-perpetuating — a satisfied
# `creates:` returns rc=0, so the guard cannot tell success from skip, and
# the marker re-blesses itself forever. so-sensor-1 was found in exactly
# that state on 2026-07-28: marker present, no /root/so-setup.log, no Salt
# installed, no key on the master, and unrepairable by any redeploy.
# NOTE: do NOT probe /etc/salt/minion_id — this SO version never writes
# it. It sets `id:` inside /etc/salt/minion instead (verified 2026-07-28:
# /etc/salt/ held grains, minion, minion.d/, pki/ but no minion_id, while
# the minion was correctly identifying as so-sensor-1_sensor). Probing
# minion_id made so_setup_can_skip permanently false, which would re-run
# 30-45 min of so-setup on every attempt forever.
- name: Probe for a real Salt install (minion config written by so-setup)
  ansible.builtin.stat:
    path: /etc/salt/minion
  register: salt_minion_id

- name: Probe for the salt-minion systemd unit
  ansible.builtin.command: systemctl list-unit-files salt-minion.service
  register: salt_unit_probe
  changed_when: false
  failed_when: false

- name: Probe for the so-setup completion marker
  ansible.builtin.stat:
    path: "{{ so_sensor_setup_marker }}"
  register: so_setup_marker_stat

- name: Decide whether the 30-45 min so-setup call can be skipped
  ansible.builtin.set_fact:
    so_setup_can_skip: >-
      {{ so_setup_marker_stat.stat.exists
         and salt_minion_id.stat.exists
         and 'salt-minion.service' in salt_unit_probe.stdout }}

- name: Report so-setup skip decision
  ansible.builtin.debug:
    msg: >-
      so-setup {{ 'SKIPPED (marker + Salt both present)' if so_setup_can_skip
      else 'WILL RUN' }} — marker={{ so_setup_marker_stat.stat.exists }},
      minion_id={{ salt_minion_id.stat.exists }},
      unit={{ 'salt-minion.service' in salt_unit_probe.stdout }}

- name: Kick off so-setup network (bash-source env then invoke)
  ansible.builtin.shell: |
    source /root/so-answers.env
    cd {{ so_source_dest }}/setup
    ./so-setup {{ so_setup_type }} > {{ so_sensor_setup_log }} 2>&1
  args:
    executable: /bin/bash
  async: "{{ so_sensor_install_timeout }}"
  poll: 0
  register: so_setup_async
  when: not so_setup_can_skip

- name: Poll so-setup completion
  ansible.builtin.async_status:
    jid: "{{ so_setup_async.ansible_job_id }}"
  register: so_setup_result
  until: so_setup_result.finished
  retries: "{{ (so_sensor_install_timeout / so_sensor_poll_interval) | int }}"
  delay: "{{ so_sensor_poll_interval }}"
  when: not so_setup_can_skip

- name: Report so-setup exit code + last log lines
  ansible.builtin.debug:
    msg: |
      so-setup rc={{ so_setup_result.rc | default('unknown') }}
      Last 20 log lines:
      {{ so_setup_result.stdout_lines[-20:] | default(['<no stdout captured>']) | join('\n') }}
  when: not so_setup_can_skip

- name: Fail if so-setup exited non-zero
  ansible.builtin.fail:
    msg: |
      so-setup returned {{ so_setup_result.rc }}. Full log at
      {{ so_sensor_setup_log }} on {{ inventory_hostname }}.
  when:
    - not so_setup_can_skip
    - so_setup_result.rc | default(1) != 0

# so-setup's exit code is NOT trustworthy. Verified 2026-07-28: it logged
# "WARNING: Errors detected during setup" with a fatal NetworkManager
# error and still exited 0. SO writes its own signals instead — a
# /root/failure marker file and /root/errors.log. Check those first;
# they are authoritative where rc is not.
- name: Check SO's own failure marker
  ansible.builtin.stat:
    path: /root/failure
  register: so_failure_marker
  when: not so_setup_can_skip

- name: Read SO's errors.log (for the failure message)
  ansible.builtin.slurp:
    src: /root/errors.log
  register: so_errors_log
  failed_when: false
  when: not so_setup_can_skip

# /root/failure alone is NOT grounds to fail. See the long note in
# so_manager/tasks/main.yml: the SimSpace image pre-bakes SO remnants, so
# so-setup always takes its reinstall path, whose elastic-agent uninstall
# logs "notify Fleet: failed" against a Fleet server that is not up yet.
# SO writes /root/failure for that and then succeeds anyway. Failing here
# would break every fresh deploy. Warn; let the outcome checks gate.
- name: Report SO's failure marker + errors.log (warning, not fatal)
  ansible.builtin.debug:
    msg: |
      NOTE: SO wrote /root/failure on {{ inventory_hostname }} (so-setup
      still exited {{ so_setup_result.rc | default('?') }}). Often benign on
      this image — see so_manager/tasks/main.yml. Judge success by the Salt
      + so-status checks that follow.

      /root/errors.log:
      {{ (so_errors_log.content | b64decode) if so_errors_log.content is defined
         else '<errors.log unreadable>' }}

      Full setup log: {{ so_sensor_setup_log }} (ours) and /root/sosetup.log
      (SO's own, more detail).
  when:
    - not so_setup_can_skip
    - so_failure_marker.stat.exists

# Second net: even with no failure marker, confirm Salt actually landed.
- name: Re-probe for Salt after so-setup
  ansible.builtin.stat:
    path: /etc/salt/minion
  register: salt_minion_id_after
  when: not so_setup_can_skip

- name: Fail if so-setup exited 0 but never installed Salt
  ansible.builtin.fail:
    msg: |
      so-setup exited 0 on {{ inventory_hostname }} but Salt was never
      installed — /etc/salt/minion does not exist. The exit code lied.
      Do NOT trust rc here. Check {{ so_sensor_setup_log }} on the host;
      if that file is missing entirely, so-setup never actually ran.
  when:
    - not so_setup_can_skip
    - not salt_minion_id_after.stat.exists

# Marker for so-setup completion (see so_search for rationale). Only
# reached once Salt is confirmed genuinely present above.
- name: Mark so-setup as completed (short-circuits shell task on retry)
  ansible.builtin.file:
    path: "{{ so_sensor_setup_marker }}"
    state: touch
    mode: '0644'
    owner: root
    group: root
  when: not so_setup_can_skip

# so-setup regenerates this minion's keypair on every (re)install
# ("Generating keys: /etc/salt/pki/minion" in sosetup.log). If the master
# still holds the OLD public key for this minion id, it rejects the new
# one and salt-minion crash-loops out with 77/NOPERM:
#   [CRITICAL] The Salt Master has rejected this minion's public key!
#   To repair this issue, delete the public key for this minion on the
#   Salt Master and restart this minion.
# Verified 2026-07-28 on so-sensor-1 — three consecutive start attempts,
# all rejected, so no key ever reached Unaccepted and grid-join could
# never succeed. Delete the stale key so the fresh one arrives as
# Unaccepted and the grid-join tasks below can accept it normally.
#
# Gated on `not so_setup_can_skip` — only when we have just re-run
# so-setup and therefore know the keypair was regenerated. Never touch a
# healthy grid member's key.
- name: Grid join — delete stale salt key for this minion on the master
  ansible.builtin.command: "sudo salt-key -d {{ inventory_hostname }}_{{ so_role }} -y"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: stale_key_del
  changed_when: "'Removed' in stale_key_del.stdout"
  # "does not match any accepted, unaccepted or rejected keys" on a first
  # install is the expected no-op, not a failure.
  failed_when: false
  when: not so_setup_can_skip

# Reboot FIRST so salt-minion restarts fresh + auto-submits its key to
# master. Grid-join tasks below wait for that key to appear before trying
# to accept it. See so_search/tasks/main.yml for full rationale.
- name: Reboot the sensor
  ansible.builtin.reboot:
    reboot_timeout: 900
    connect_timeout: 60
    post_reboot_delay: 30

# --- Grid-join handshake (delegated to manager, POST-reboot) ------------
# See so_search/tasks/main.yml for full rationale. Sensor has one extra
# step vs search: after so-minion generates the per-minion pillar, we
# override sensor.interface from the default 'bond0' to
# {{ so_monitor_interface }} (tun0 on our GRE-mirror setup) — else
# suricata + zeek would bind to a phantom bond0 and capture 0 packets.

- name: Grid join — preflight, confirm salt-key is invokable on manager
  ansible.builtin.command: "sudo salt-key --version"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  changed_when: false
  # Fail fast and loud. Without this, a missing/renamed salt-key binary is
  # swallowed by the 30×10s `until` loop below — it retries a hard
  # "command not found" for a full 5 min before surfacing the real error.

# WAITS FOR THE END STATE, NOT FOR ONE PARTICULAR ROUTE TO IT.
#
# This used to poll `salt-key --list=unaccepted` and wait for the key to show
# up there. That is only correct on a FIRST install, where the key really does
# pass through Unaccepted on its way to Accepted. A node that is ALREADY a grid
# member never enters Unaccepted -- it reconnects with the accepted key it
# already holds -- so the gate waited 30 x 10s for a transition that could not
# happen, and failed a node that was perfectly healthy.
#
# ss-pp-so 2026-09-03: so-sensor-ot and so-sensor-edge failed here with
# `stdout: "Unaccepted Keys:"`, an EMPTY list, while both keys sat in Accepted
# on the master and both nodes were serving traffic with Zeek and Suricata up
# and green. The reboot above carries no `when:` guard so it runs even when
# so_setup_can_skip is true, while the stale-key delete DOES carry that guard
# and is skipped -- so on a re-run against a working grid the key is
# deliberately left in place, and then this gate demanded to see it somewhere
# it could never be.
#
# The task immediately below already tolerates exactly this case:
#     'does not match any unaccepted keys' not in so_min_add.stdout
# The gate was therefore strictly stricter than the step it exists to protect.
# When a gate and the operation behind it disagree about what counts as ready,
# the gate is the one that is wrong.
#
# Now: proceed as soon as the master KNOWS this key, in either state.
# so-minion -o=add accepts it when unaccepted and no-ops when already accepted.
# A genuinely fresh minion that has not authenticated yet is still absent from
# both lists, so the wait this task exists for is preserved.
#
# Accepted and Unaccepted are queried SEPARATELY and matched with `grep -qxF`
# rather than reading `--list=all`: that also prints the Rejected and Denied
# sections, so a substring test against it would pass on a REJECTED key -- the
# state (later 6) records as unrepairable -- and a whole-line match stops one
# minion id from matching inside another.
- name: Grid join — wait for this node's salt-key to reach the master
  # Invoked bare (not /usr/sbin/salt-key). SO ships its OWN helpers in
  # /usr/sbin (so-firewall, so-minion), but salt's binaries come from the
  # Salt onedir package and land in /usr/bin. sudo's secure_path covers
  # them — `sudo salt-call` above already proves that.
  ansible.builtin.shell: |
    key="{{ inventory_hostname }}_{{ so_role }}"
    un=$(sudo salt-key --list=unaccepted --no-color | sed 's/^[[:space:]]*//')
    ac=$(sudo salt-key --list=accepted   --no-color | sed 's/^[[:space:]]*//')
    printf 'unaccepted:\n%s\naccepted:\n%s\n' "$un" "$ac"
    if printf '%s\n%s\n' "$un" "$ac" | grep -qxF "$key"; then
      echo "GRIDKEY_PRESENT"
    else
      echo "GRIDKEY_ABSENT"
    fi
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: pending_keys
  until: "'GRIDKEY_PRESENT' in pending_keys.stdout"
  retries: 30
  delay: 10
  changed_when: false

- name: Grid join — on manager, so-minion -o=add (accept key + generate per-minion pillar)
  ansible.builtin.command: "sudo /usr/sbin/so-minion -o=add -m={{ inventory_hostname }}_{{ so_role }}"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: so_min_add
  failed_when:
    - so_min_add.rc != 0
    - "'does not match any unaccepted keys' not in so_min_add.stdout"

- name: Grid join — override sensor.interface in per-minion pillar (bond0 → {{ so_monitor_interface }})
  ansible.builtin.replace:
    path: "/opt/so/saltstack/local/pillar/minions/{{ inventory_hostname }}_{{ so_role }}.sls"
    regexp: "^(\\s*interface:\\s*)'bond0'"
    replace: "\\1'{{ so_monitor_interface }}'"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true

# The `replace` above is a SILENT NO-OP if the pattern misses — it matches
# `interface: 'bond0'` with single quotes specifically. Since the (later 7)
# SOCLOUD fix, so-setup writes tun0 itself and the replace legitimately
# changes nothing, so "it reported ok" proves nothing either way. Verify
# the end state instead of trusting the transformation.
- name: Grid join — verify per-minion pillar carries the intended monitor interface
  ansible.builtin.command: "grep -E '^[[:space:]]*interface:' /opt/so/saltstack/local/pillar/minions/{{ inventory_hostname }}_{{ so_role }}.sls"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  register: pillar_iface
  changed_when: false
  failed_when: so_monitor_interface not in pillar_iface.stdout

- name: Grid join — report per-minion pillar interface
  ansible.builtin.debug:
    msg: "per-minion pillar interface: {{ pillar_iface.stdout | trim }}"

- name: Grid join — kick highstate on this node (fire-and-forget; so-status wait below covers it)
  ansible.builtin.command: "sudo salt {{ inventory_hostname }}_{{ so_role }} state.highstate --async"
  delegate_to: "{{ groups['so_manager'][0] }}"
  become: true
  changed_when: false

# --- Verify + marker ---------------------------------------------------

- name: Verify sensor has joined + services up
  ansible.builtin.command: sudo so-status
  register: so_status
  changed_when: false
  # Sensor's grid-join highstate installs docker + pulls ~11 container
  # images (suricata, zeek, strelka x6, steno, sensoroni, telegraf) from
  # the manager's registry + starts them. Empirically 10-15 min.
  # 40 × 30s = 20 min ceiling.
  retries: 40
  delay: 30
  # THE RETRY GATE MUST TEST WHAT THE ASSERT BELOW TESTS.
  #
  # This was `until: so_status.rc == 0`, and `so-status not yet available`
  # EXITS 0. So on a node that had not finished converging, the gate was
  # satisfied by the very first poll, the loop exited after one sample, and
  # the assert -- which tests something strictly stronger -- failed on that
  # sample. The retry budget that exists for exactly this convergence window
  # was never spent. Not once.
  #
  # ss-pp-so 2026-09-02: so-sensor-ot and so-sensor-edge failed this way while
  # so-sensor-corp passed, on an identical grid. corp passed by LUCK -- its
  # early polls returned non-zero, which forced it to keep retrying until it
  # was genuinely healthy. Checked afterwards, all five salt keys were
  # Accepted, 4505/4506 open from every sensor, /opt/so and so-status present,
  # and ot and edge had both logged "Successfully completed setup!" while corp
  # -- the one that PASSED -- was the only node with a setup warning. The grid
  # was fine and the CHECK was broken.
  #
  # That is also why this "worked before and does not now": whether a node's
  # first sample is rc=0-but-unhappy or rc!=0 is pure timing, so the same code
  # passes on a fast range and fails on a slow one.
  #
  # The assert one line down already says "an exit code is not proof". The
  # gate directly above it was using the exit code as proof.
  until: >-
    so_status.rc == 0 and
    ('adversaries cry' in so_status.stdout or 'STATUS: OK' in so_status.stdout)
  # Ansible marks a task failed when `until` is exhausted, and failed_when
  # does NOT override that -- so without this the play dies with a bare
  # "maximum retries exceeded" and the assert never runs. Nothing is swallowed:
  # the assert below is the real gate, and it prints the actual so-status
  # output instead of a retry counter.
  ignore_errors: true

- name: Assert so-status actually reports a healthy grid (rc alone is not proof)
  ansible.builtin.assert:
    that:
      - "'adversaries cry' in so_status.stdout or 'STATUS: OK' in so_status.stdout"
    fail_msg: |
      so-status exited 0 on {{ inventory_hostname }} but did not report a
      healthy grid. An exit code is not proof — so-setup already taught us
      that (UPSTREAM_FIXES 2026-07-28 later 6). Last lines:
      {{ so_status.stdout_lines[-15:] | join('\n') }}
    success_msg: "so-status reports a healthy grid"
    quiet: true

- name: Report sensor status
  ansible.builtin.debug:
    msg: "{{ so_status.stdout_lines[-15:] }}"

# Marker written AFTER so-status verify passes. If grid-join or verify
# fails, a re-run re-executes grid-join instead of short-circuiting.
- name: Write installed marker for idempotent re-runs (only after so-status green)
  ansible.builtin.file:
    path: "{{ so_sensor_installed_marker }}"
    state: touch
    mode: '0644'
    owner: root
    group: root

# --- Traffic-flow smoke test -------------------------------------------

- name: 5-sec tcpdump on {{ so_monitor_interface }} — packet count > 0 means GRE mirror delivering
  ansible.builtin.shell: |
    timeout 5 tcpdump -i {{ so_monitor_interface }} -c 100 -nn 2>&1 | tail -3
  changed_when: false
  register: pcap_smoke

- name: Report pcap flow
  ansible.builtin.debug:
    msg: "{{ pcap_smoke.stdout_lines }}"
