---
# syslog_server — configure rsyslog on pp-syslog as the central collector.
#
# Listens on UDP/514 + TCP/514, writes incoming events to per-host files at
# /var/log/remote/<hostname>/syslog.log, one directory per sender so host
# attribution survives the relay.
#
# NOTHING TAILS THIS STORE. Splunk was removed 2026-09-09 and the files are
# now a local artifact only -- a realistic enterprise construct and a
# plausible attacker target, but not a SIEM feed. Linux hosts ship their own
# syslog to Security Onion via the Elastic Agent system integration, so
# relaying these files would put every message in SO twice.
#
# Devices that cannot run an agent (pfSense, VyOS) dual-send: to :514 here,
# and to the Elastic Agent listeners on this same host that parse them into
# Security Onion.
#
# Driven by group_vars/all.yml: syslog_server_ip is informational here; the
# server binds to all interfaces.

- name: Ensure rsyslog is installed
  ansible.builtin.apt:
    name: rsyslog
    state: present
    update_cache: false

- name: Create /var/log/remote
  ansible.builtin.file:
    path: /var/log/remote
    state: directory
    owner: syslog
    group: adm
    mode: '0755'

- name: Drop rsyslog collector config
  ansible.builtin.template:
    src: 30-remote.conf.j2
    dest: /etc/rsyslog.d/30-remote.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart rsyslog

- name: Ensure rsyslog is enabled + running
  ansible.builtin.systemd:
    name: rsyslog
    state: started
    enabled: true

# --- Relay firewall syslog to the local Elastic agent ---------------------
# See templates/29-fleet-forward.conf.j2 for why this is a local fan-out
# rather than a second destination configured on the firewalls.
- name: Relay pfSense syslog to the local Elastic agent
  ansible.builtin.template:
    src: 29-fleet-forward.conf.j2
    dest: /etc/rsyslog.d/29-fleet-forward.conf
    mode: '0644'
    owner: root
    group: root
  register: fleet_forward_conf

# Was 31- until 2026-09-10, where it sorted AFTER 30-remote.conf's `stop`
# and was therefore unreachable. Remove the stale copy or both exist.
- name: Remove the superseded 31- relay config
  ansible.builtin.file:
    path: /etc/rsyslog.d/31-fleet-forward.conf
    state: absent
  register: fleet_forward_old

- name: Restart rsyslog if the relay config changed
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
  when: fleet_forward_conf.changed
