---
# so_base defaults — most values come from group_vars/all.yml + host_vars.

# Where the SO source tarball is extracted on each SO node.
# so-setup at master lines 138-139 auto-detects this path:
#   if -d /root/manager_setup/securityonion && pwd != /root/manager_setup/securityonion/setup
#     exec bash /root/manager_setup/securityonion/setup/so-setup ...
so_source_dest: "/root/manager_setup/securityonion"

# Where the snapshotted so-setup + supporting scripts are shipped from
# (relative to the ansible controller's files/ dir, per Ansible's
# role-relative file lookup).
so_snapshot_files:
  - so-setup
  - so-functions
  - so-variables
  - so-whiptail

# In-range subnets that must bypass the upstream proxy.
#
# Was a hardcoded list of so_subnet_{security,operations,engineering,services}
# in templates/environment.j2 — dev-range-specific names that do not exist in
# other ranges (PowerPlant has services/business/engineering/legal/infosec/dmz
# and no "operations"), so the template rendered undefined there. Override in
# group_vars per range.
#
# NOTE these must be literal names, not CIDRs, for the hostname portion —
# Python's urllib does not parse CIDR notation in no_proxy at all
# (UPSTREAM_FIXES 2026-07-23). The CIDRs here are harmless but the per-host
# entries appended in the template are what actually work.
# Empty default ON PURPOSE — a default that named specific subnets would
# reference variables that do not exist in every range, which is the bug this
# variable was created to fix. Each range sets its own list in group_vars.
so_no_proxy_subnets: []
