---
# Linux needs privilege where Windows does not: WinRM already runs elevated,
# but here /opt is root-owned, the installer writes system paths and systemctl
# needs root. `become` is set PER TASK rather than on the play, so nothing
# escalates that does not need to -- see UPSTREAM_FIXES 2026-08-04 (later 9),
# where a play-level become: true broke a chmod that needed no privilege.
- name: Is the Elastic Agent service already active?
  ansible.builtin.command: "systemctl is-active {{ so_agent_linux_service }}"
  register: agent_active_before
  changed_when: false
  failed_when: false

- name: Staging directory
  become: true
  ansible.builtin.file:
    path: "{{ so_agent_linux_dir }}"
    state: directory
    mode: '0755'
  when: agent_active_before.stdout | trim != 'active'

- name: Download SO's Elastic Agent installer
  become: true
  ansible.builtin.get_url:
    url: "{{ so_agent_mirror_url }}/{{ so_agent_installer_linux }}"
    dest: "{{ so_agent_linux_dir }}/{{ so_agent_installer_linux }}"
    mode: '0755'
    timeout: 900
  when: agent_active_before.stdout | trim != 'active'

- name: Run the installer (enrolls into Fleet using the embedded token)
  become: true
  ansible.builtin.command: >-
    {{ so_agent_linux_dir }}/{{ so_agent_installer_linux }} {{ so_agent_install_args }}
  when: agent_active_before.stdout | trim != 'active'
  changed_when: agent_install.rc == 0
  failed_when: false
  # Retried, because enrollment is a network operation against a manager whose
  # iptables is REWRITTEN every ~15 minutes: SO's firewall state runs
  # `iptables_restore` as a bare cmd.run with no `onchanges`. An unmatched
  # packet during that window falls through to
  # `-A FORWARD -j REJECT --reject-with icmp-host-prohibited`, giving the agent
  # "no route to host" rather than a timeout. On 2026-08-05 pp-syslog PASSED
  # the 8220 preflight and then hit exactly that seconds later; the agent's own
  # backoff gave up after ~8s and cleanly uninstalled itself.
  #
  # Safe to retry: a failed enroll removes the install directory and service,
  # so each attempt starts clean.
  register: agent_install
  until: agent_install.rc == 0
  retries: 4
  delay: 45

- name: Wait for the Elastic Agent service to become active
  become: true
  ansible.builtin.command: "systemctl is-active {{ so_agent_linux_service }}"
  register: agent_active_after
  until: agent_active_after.stdout | trim == 'active'
  retries: 36
  delay: 5
  changed_when: false
  failed_when: false

- name: Fail with the installer output if the agent never started
  ansible.builtin.fail:
    msg: |
      Elastic Agent is not active on {{ inventory_hostname }}
      (systemctl is-active: {{ agent_active_after.stdout | trim }}).

      Installer rc={{ agent_install.rc | default('n/a') }}
      stdout: {{ agent_install.stdout | default('') | trim }}
      stderr: {{ agent_install.stderr | default('') | trim }}

      The usual cause is the elastic_agent_endpoint firewall hostgroup not
      covering this host's subnet, so enrollment to 8220 times out.
  when: agent_active_after.stdout | trim != 'active'

- name: Report
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: Elastic Agent {{ agent_active_after.stdout | trim }}
      {{ '(already installed)' if agent_active_before.stdout | trim == 'active' else '(newly enrolled)' }}
