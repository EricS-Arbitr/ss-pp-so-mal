---
# Overlay of the upstream splunk-es role.
# Differences vs. base:
#   1. Adds a second readiness probe that polls /services/admin/localapps —
#      the exact endpoint essinstall calls. /services/server/info responds
#      far earlier than localapps does on a freshly-installed Splunk, so
#      essinstall would fire while Splunk was still bootstrapping ES.
#   2. Wraps essinstall in a retry loop; even after localapps responds it
#      can intermittently time out during heavy datamodel/summary loading.

- name: Check Splunk Status
  ansible.builtin.systemd:
    name: splunk
    enabled: true
    state: started
  register: splunk_status

- name: Ensure Splunk Tmp Directory Exists
  ansible.builtin.file:
    path: "{{ staging_dir_linux }}/splunk"
    state: directory
    mode: '0755'
  register: tmp_directory_check

- name: Get Splunk Apps
  ansible.builtin.find:
    paths: "{{ ansible_installers }}/splunk/apps/"
    patterns: "*.tg*"
  delegate_to: localhost
  register: splunk_apps

- name: Copy Splunk Apps to Staging Directory
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ staging_dir_linux }}/splunk/apps/"
    mode: '0644'
  with_items: "{{ splunk_apps.files }}"
  when: splunk_apps.matched > 0

- name: Install Splunk Apps
  ansible.builtin.shell: >
    /opt/splunk/bin/splunk install app {{ staging_dir_linux }}/splunk/apps/{{ item.path | basename }}
    -auth {{ splunk_admin }}:{{ splunk_admin_password }} -update true
  with_items: "{{ splunk_apps.files }}"
  register: install_apps_result
  retries: 6
  delay: 20
  until: install_apps_result.rc == 0
  changed_when: install_apps_result.rc == 0

- name: Copy Enterprise Security App
  ansible.builtin.copy:
    src: "{{ ansible_installers }}/splunk/splunk-es.spl"
    dest: "{{ staging_dir_linux }}/splunk/"
    mode: '0644'
  register: copy_es_result

- name: Install Enterprise Security App
  ansible.builtin.shell: >
    /opt/splunk/bin/splunk install app {{ staging_dir_linux }}/splunk/splunk-es.spl
    -auth {{ splunk_admin }}:{{ splunk_admin_password }} -update true
  register: install_es_result
  retries: 6
  delay: 30
  until: install_es_result.rc == 0
  changed_when: false
  notify: Restart Splunk Service

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Wait for Splunk REST API to be fully ready
  ansible.builtin.uri:
    url: "https://127.0.0.1:8089/services/server/info"
    method: GET
    user: "{{ splunk_admin }}"
    password: "{{ splunk_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: splunk_api_check
  retries: 20
  delay: 15
  until: splunk_api_check.status == 200

# Splunk's REST server caps threads at httpServer.maxThreads (default 8 on a
# 4-vCPU box from the base server.conf.j2). The splunk_secure_gateway modular
# input alone hammers this limit during ES bootstrap, leaving no slots for
# essinstall — which then gets HTTP 503 with an HTML body and dies with
# JSONDecodeError. Disable SSG (unused in a closed range) and raise the cap
# before running essinstall.
- name: Pre-disable Splunk apps that interfere with ES bootstrap
  # splunk_secure_gateway: not used in a closed range; modular input hogs REST threads
  # missioncontrol: essinstall tries to disable it; its endpoint hangs and times out essinstall
  ansible.builtin.shell: >
    /opt/splunk/bin/splunk disable app {{ item }}
    -auth {{ splunk_admin }}:{{ splunk_admin_password }}
  loop:
    - splunk_secure_gateway
    - missioncontrol
  register: disable_apps_result
  changed_when: "'disabled' in (disable_apps_result.stdout | default('')) and 'already' not in (disable_apps_result.stdout | default(''))"
  failed_when: false
  notify: Restart Splunk Service

- name: Raise [httpServer] maxThreads in server.conf for ES bootstrap
  community.general.ini_file:
    path: /opt/splunk/etc/system/local/server.conf
    section: httpServer
    option: maxThreads
    value: "64"
    mode: '0644'
  register: maxthreads_conf
  notify: Restart Splunk Service

- name: Flush handlers to apply SSG-disable + maxThreads change
  ansible.builtin.meta: flush_handlers

- name: Wait for Splunk REST API again after second restart
  ansible.builtin.uri:
    url: "https://127.0.0.1:8089/services/server/info"
    method: GET
    user: "{{ splunk_admin }}"
    password: "{{ splunk_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: splunk_api_check_2
  retries: 20
  delay: 15
  until: splunk_api_check_2.status == 200

# Pre-warm: essinstall calls /services/admin/localapps, which is heavy on a
# freshly-installed Splunk. Poll it directly with long retries so we don't
# fire essinstall before that endpoint is willing to answer.
- name: Wait for Splunk localapps endpoint to be responsive
  ansible.builtin.uri:
    url: "https://127.0.0.1:8089/services/admin/localapps?count=0"
    method: GET
    user: "{{ splunk_admin }}"
    password: "{{ splunk_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    timeout: 120
    status_code: 200
  register: splunk_localapps_check
  retries: 30
  delay: 30
  until: splunk_localapps_check.status == 200

- name: Configure Enterprise Security App
  ansible.builtin.shell: >
    set -o pipefail && /opt/splunk/bin/splunk search '| essinstall --ssl_enablement ignore'
    -auth {{ splunk_admin }}:{{ splunk_admin_password }}
  args:
    executable: /bin/bash
  register: configure_es_result
  changed_when: false
  retries: 3
  delay: 120
  until: configure_es_result.rc == 0
  notify: Restart Splunk Service

- name: Check Content Update Directory
  ansible.builtin.file:
    path: "/opt/splunk/etc/apps/DA-ESS-ContentUpdate/local/"
    state: directory
    mode: '0755'

- name: Check Endpoint Protection Directory
  ansible.builtin.file:
    path: "/opt/splunk/etc/apps/SA-EndpointProtection/local/"
    state: directory
    mode: '0755'

- name: Check CIM Directory
  ansible.builtin.file:
    path: "/opt/splunk/etc/apps/Splunk_SA_CIM/local/"
    state: directory
    mode: '0755'

- name: Check ES Directory
  ansible.builtin.file:
    path: "/opt/splunk/etc/apps/SplunkEnterpriseSecuritySuite/local/"
    state: directory
    mode: '0755'

# --- ES / CIM content, vendored 2026-09-04 ------------------------------
# These seven files used to be read from /etc/ansible/templates/splunkapps/ on
# the CONTROLLER -- a path this repo never shipped. They arrived via the
# RC_NG_Ansible base image, so every deploy silently bet on that image still
# carrying them, unchanged, at the version we expect. The controller is rebuilt
# fresh for every range, so that bet was placed every single time.
#
# Same class of failure as the pfsensible collection installing to
# /root/.ansible: "present on the controller" is not "present in the artifact
# we ship". They also could not be diffed or reviewed, and they define ES saved
# searches, CIM macros and data models -- the detection content itself. A base
# image refresh would have changed range behaviour with nothing to show for it.
#
# THE .j2 SUFFIX WAS DECORATIVE and has been dropped. All seven were read with
# ansible.builtin.copy, not template, and measured to contain ZERO Jinja
# references -- so nothing was ever rendered. Keeping the extension would keep
# inviting someone to "fix" the module to `template:` and change behaviour.
#
# Verified before vendoring: the three local copies of range-development-ansible
# are byte-identical to each other AND match the controller file sizes exactly.
# The only environment-specific value anywhere is LOGSTASH_HOST = 10.255.240.1
# in stack_op_forwarder.py, which is the SimSpace management gateway and
# constant across ranges -- hence static files, not templates.
- name: Copy Content Update Saved Searches
  ansible.builtin.copy:
    src: "cu-savedsearches.conf"
    dest: "/opt/splunk/etc/apps/DA-ESS-ContentUpdate/local/savedsearches.conf"
    mode: '0644'
  notify: Restart Splunk Service

- name: Copy Endpoint Protection Saved Searches
  ansible.builtin.copy:
    src: "ep-savedsearches.conf"
    dest: "/opt/splunk/etc/apps/SA-EndpointProtection/local/savedsearches.conf"
    mode: '0644'
  notify: Restart Splunk Service

- name: Copy CIM Macros
  ansible.builtin.copy:
    src: "cim-macros.conf"
    dest: "/opt/splunk/etc/apps/Splunk_SA_CIM/local/macros.conf"
    mode: '0644'
  notify: Restart Splunk Service

- name: Copy CIM Datamodels
  ansible.builtin.copy:
    src: "cim-datamodels.conf"
    dest: "/opt/splunk/etc/apps/Splunk_SA_CIM/local/datamodels.conf"
    mode: '0644'
  notify: Restart Splunk Service

- name: Copy ES Saved Searches
  ansible.builtin.copy:
    src: "es-savedsearches.conf"
    dest: "/opt/splunk/etc/apps/SplunkEnterpriseSecuritySuite/local/savedsearches.conf"
    mode: '0644'
  notify: Restart Splunk Service

- name: Copy Forwarding Script
  ansible.builtin.copy:
    src: "stack_op_forwarder.py"
    dest: "/opt/splunk/bin/scripts/stack_op_forwarder.py"
    mode: '0755'
  notify: Restart Splunk Service

- name: Make Directory
  ansible.builtin.file:
    path: "/opt/splunk/etc/users/admin/search/local"
    state: directory
    mode: '0755'
  notify: Restart Splunk Service

- name: Copy Alert Action
  ansible.builtin.copy:
    src: "alert-savedsearches.conf"
    dest: "/opt/splunk/etc/users/admin/search/local/savedsearches.conf"
    mode: '0644'
  notify: Restart Splunk Service

- name: Cleanup Staging Directory
  ansible.builtin.file:
    path: "{{ staging_dir_linux }}/splunk/apps/"
    state: absent
