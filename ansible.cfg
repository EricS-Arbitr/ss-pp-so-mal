[defaults]
# Vault password. Customer convention (CLAUDE.md) puts it here on the deployed
# Ansible host; locally it is ./.vault_pass, which is gitignored.
vault_password_file = /home/simspace/.vault_pass

# Roles live in ./roles; the playbooks live in ./playbooks. Ansible looks next
# to the playbook first (playbooks/roles, which does not exist), then in the
# default path, so from any checkout that is not /etc/ansible every role fails
# to resolve. Relative paths here resolve against the CURRENT DIRECTORY, not
# this file, and deploy.sh runs `ansible-playbook site.yml` without cd-ing --
# so the absolute production path stays as the backstop.
roles_path = ./roles:/etc/ansible/roles

inventory = hosts
host_key_checking = false
retry_files_enabled = true
retry_files_save_path = ./retry

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
