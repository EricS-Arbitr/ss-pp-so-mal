[defaults]
# Vault password. Customer convention (CLAUDE.md) puts it here on the deployed
# Ansible host; locally it is ./.vault_pass, which is gitignored.
vault_password_file = /home/simspace/.vault_pass

inventory = hosts
host_key_checking = false
retry_files_enabled = true
retry_files_save_path = ./retry

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
