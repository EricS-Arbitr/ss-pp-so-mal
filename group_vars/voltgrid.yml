domain_name: "voltgrid.com"
short_domain_name: "voltgrid"
proxy_server: 172.16.2.20
domain_tld_name: "com"
file_server_alias: "file"
file_server_ip: "172.16.2.3"
map_drive_letter: S
map_drive_path: \\pp-file.voltgrid.com\Share

internal_dns_records:
  # WordPress site (pp-www, DMZ — not AD-joined)
  - name: "www"
    type: "A"
    value: "172.16.8.5"
    zone: "{{ domain_name }}"
  - name: "5.8.16.172.in-addr.arpa"
    type: "PTR"
    value: "www.{{ domain_name }}"
    zone: "8.16.172.in-addr.arpa"

  # Billing portal (pp-www, same host as WordPress — vhost routed by nginx)
  - name: "billing"
    type: "A"
    value: "172.16.8.5"
    zone: "{{ domain_name }}"

  # Service aliases for AD-joined hosts
  - name: "mail"
    type: "A"
    value: "172.16.2.5"
    zone: "{{ domain_name }}"
  - name: "file"
    type: "A"
    value: "172.16.2.3"
    zone: "{{ domain_name }}"
  - name: "sql"
    type: "A"
    value: "172.16.2.4"
    zone: "{{ domain_name }}"

  # DMZ hosts (not AD-joined — need static records)
  - name: "pp-dmz-smtp"
    type: "A"
    value: "172.16.8.3"
    zone: "{{ domain_name }}"
  - name: "smtp"
    type: "A"
    value: "172.16.8.3"
    zone: "{{ domain_name }}"
  - name: "pp-dmz-dns"
    type: "A"
    value: "172.16.8.4"
    zone: "{{ domain_name }}"

  # Outbound proxy (not AD-joined)
  - name: "pp-proxy"
    type: "A"
    value: "172.16.2.20"
    zone: "{{ domain_name }}"

  # PTRs for non-AD-joined hosts
  - name: "3.8.16.172.in-addr.arpa"
    type: "PTR"
    value: "pp-dmz-smtp.{{ domain_name }}"
    zone: "8.16.172.in-addr.arpa"
  - name: "4.8.16.172.in-addr.arpa"
    type: "PTR"
    value: "pp-dmz-dns.{{ domain_name }}"
    zone: "8.16.172.in-addr.arpa"
  - name: "20.2.16.172.in-addr.arpa"
    type: "PTR"
    value: "pp-proxy.{{ domain_name }}"
    zone: "2.16.172.in-addr.arpa"

  # Security Onion grid (security-onion branch only). Not AD-joined, so they
  # have no DNS record of their own -- same situation as pp-www above.
  #
  # WHY: Elastic Agent on every endpoint resolves the manager by SHORT NAME for
  # its Fleet/Elasticsearch output. Endpoints use pp-dc01 (172.16.2.7) for DNS,
  # which had no record, producing a steady stream of
  #   DNS lookup failure "so-manager" on 172.16.2.7:53: server misbehaving
  # every few seconds from pp-bp-wkstn-*, pp-dc03, pp-syslog and others.
  # Enrollment itself used the IP, so agents joined and ship data -- this is a
  # degraded path, not a broken one, but it is constant noise in the SO events
  # list and any retry it governs is failing.
  #
  # A records only: there is no 9.16.172.in-addr.arpa reverse zone in this
  # range (only 8.16.172 and 2.16.172), so PTRs would target a zone that does
  # not exist.
  - name: "so-manager"
    type: "A"
    value: "172.16.9.30"
    zone: "{{ domain_name }}"
  - name: "so-search"
    type: "A"
    value: "172.16.9.35"
    zone: "{{ domain_name }}"
  - name: "so-sensor-corp"
    type: "A"
    value: "172.16.9.40"
    zone: "{{ domain_name }}"
  - name: "so-sensor-ot"
    type: "A"
    value: "172.16.9.41"
    zone: "{{ domain_name }}"
  - name: "so-sensor-edge"
    type: "A"
    value: "172.16.9.42"
    zone: "{{ domain_name }}"
