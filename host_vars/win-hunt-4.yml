# host_vars/win-hunt-4.yml — SOC hunt/analyst workstation
# Image: ARB_PP_DO_001.yml builds every RDP_Windows_10 host on 1.2.1,
# including all six hunt boxes -- this host is no longer special. The note
# that used to live here pinned 1.0.6 and warned off 1.1.0, which ships DHCP
# enabled and breaks common's DSC xIPAddress with a cryptic "Not found" (the
# reason win-hunt-1 was once reverted; see PROJECT_LOG / UPSTREAM_FIXES).
# Whether 1.2.1 carries that behaviour is UNVERIFIED -- if static addressing
# ever fails again, check Get-NetIPInterface -Dhcp before anything else.
# Domain-joined via [members]; DNS is pp-dc01 so the join can resolve
# _ldap._tcp.dc._msdcs.voltgrid.com.
ansible_host: 10.255.240.214
network_interfaces:
  - name: "Ethernet0"
    ipv4:
      address: "10.255.240.214"
      netmask: "255.255.240.0"
      gateway: ""
  - name: "Ethernet1"
    ipv4:
      address: "172.16.9.14"
      netmask: "255.255.255.0"
      gateway: "172.16.9.1"
    dns:
      - "172.16.2.7"

# Autologin identity. The `configure hunt` play applies the autologin role,
# which is gated on `logon_user is defined` -- without these it has always
# been a silent no-op on the hunt boxes. DefaultDomainName resolves from
# `domain_name`, which these hosts now get via [voltgrid].
logon_user: "helena.vogt"
logon_user_password: "Simspace1!Simspace1!"
