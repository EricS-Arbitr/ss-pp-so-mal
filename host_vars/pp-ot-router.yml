ansible_host: "10.255.240.201"

# SimSpace provisions: eth0 = first data-plane (shared with mgmt 10.255.240.201/20)
# NOTE: image is global/RC_NG_OT_Router (not RC-VyOS-Router). Treated here as
# vyos-managed per user direction; verify the vyos role actually applies if
# BGP sessions don't come up.
network_interfaces:
  - name: "eth0"                      # switch-8 transit to pp-ot-firewall (mgmt shares)
    ipv4:
      address: "192.168.200.202"
      netmask: "255.255.255.252"
      type: "ethernet"
      ospf: true
  - name: "eth1"                      # Gas-Turbine gateway
    ipv4:
      address: "192.168.95.1"
      netmask: "255.255.255.0"
      type: "ethernet"
      ospf: true
  - name: "eth2"                      # Gas-Turbine-Sim gateway (/27)
    ipv4:
      address: "192.168.90.1"
      netmask: "255.255.255.224"
      type: "ethernet"
      ospf: true
  - name: "eth3"                      # PP-OT-Services gateway (/27)
    ipv4:
      address: "192.168.90.97"
      netmask: "255.255.255.224"
      type: "ethernet"
      ospf: true
  - name: "eth4"                      # 192.168.100.0/24 OT subnet — pp-dc03,
    ipv4:                             # pp-dcs-ctrl, pp-ctl-wks-01..04 live here.
      address: "192.168.100.1"        # Documentation only — pp-ot-router is in
      netmask: "255.255.255.0"        # [vyos_routes_only], the vyos role does
      type: "ethernet"                # not run on it; SimSpace platform configures
      ospf: true                      # the interface from the layout YAML directly.

# pp-ot-firewall was migrated from VyOS to pfSense (static routing only),
# so the BGP peering through it is gone. Replaced with a static default
# route inward through the new firewall.
#
# IMPORTANT: pp-ot-router is in [vyos_routes_only] (not [vyos]) because the
# customer's full vyos role's interface tasks fail on the RC_NG_OT_Router
# appliance. So we use extra_static_routes (handled by the "Additional VyOS
# static routes" play) rather than the role's single `static_route` field
# (which only runs for hosts the full role targets).
extra_static_routes:
  - network: "0.0.0.0/0"
    next_hop: "192.168.200.201"       # pp-ot-firewall (pfSense)
    descr: "Default inward via pp-ot-firewall"

bgp: []

# --- Security Onion GRE mirror → so-sensor-ot ---------------------------
# Mirrors the four OT interfaces into a GRE tunnel terminating on
# so-sensor-ot (172.16.9.41). eth0 (switch-8 transit, shares mgmt) excluded.
#
# GRE path: pp-ot-router → pp-ot-firewall → pp-internal-router → pp-security.
# pp-ot-firewall ALREADY passes this — it runs lab-mode permit-any on every
# interface with blockpriv/blockbogons off (verified 2026-07-30). An explicit
# narrow GRE rule was added to its host_vars anyway so the dependency survives
# a future tightening pass; see host_vars/pp-ot-firewall.yml.
#
# ⚠ REMAINING BLOCKER: this host is in [vyos_routes_only], NOT [vyos] — its RC_NG_OT_Router
#    image rejects the vyos role's interface commands and accepts only raw
#    static routes via vyos_config. vyos_mirror does two things: a tunnel
#    interface via vyos_config (probably fine) and a tc script pushed over
#    plain SSH (unproven on this image). VERIFY before assuming the OT
#    mirror works — this is the same class of image limitation that made the
#    old OT-pfSense image unmanageable from Ansible.
vyos_mirror_source_interfaces:
  - eth1   # Gas-Turbine      192.168.95.0/24
  - eth2   # Gas-Turbine-Sim  192.168.90.0/27
  - eth3   # PP-OT-Services   192.168.90.96/27
  - eth4   # PP-OT-Ctrl       192.168.100.0/24

vyos_gre_source_ip: "192.168.200.202"  # eth0, routes to pp-security
vyos_gre_remote_ip: "172.16.9.41"      # so-sensor-ot
vyos_gre_local_addr: "10.100.2.1"
vyos_gre_remote_addr: "10.100.2.2"
vyos_gre_tunnel_prefix: 30

# Do NOT mirror management-plane traffic. eth0 on this router shares the mgmt
# IP with a data-plane gateway, so a bare matchall mirror would copy every
# Ansible SSH/WinRM session into the sensor. Rendered by vyos_mirror as tc
# `action pass` filters ahead of the catch-all, matching src and dst.
vyos_mirror_exclude_cidrs:
  - "10.255.240.0/20"
